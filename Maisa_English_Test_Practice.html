<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English Test | Practice — Maísa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Inter:wght@400;500;600;700&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FAF6EE;--paper-line:#DCE6F0;--margin-red:#e8a2ad;
  --ink:#22314f;--ink-soft:#5b6785;
  --pink:#ff2e93;--pink-bg:#ffd9ec;
  --red:#d6455a;--red-bg:#fde3e3;
  --yellow:#ffdd66;--yellow-bg:#fff6d8;
  --blue:#2f6fed;--blue-bg:#e3ecff;
  --green:#1f9d63;--green-bg:#e2f6ec;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:'Inter',sans-serif;color:var(--ink);
  background:
    linear-gradient(90deg,transparent 46px,var(--margin-red) 47px,var(--margin-red) 48px,transparent 49px),
    repeating-linear-gradient(var(--paper),var(--paper) 33px,var(--paper-line) 34px,var(--paper) 35px);
  min-height:100vh;
}
.wrap{max-width:780px;margin:0 auto;padding:32px 20px 80px 64px;}
@media(max-width:600px){.wrap{padding:24px 16px 60px 16px;}}

header{text-align:center;margin-bottom:28px;}
header h1{font-family:'Caveat',cursive;font-size:2.6rem;color:var(--pink);line-height:1.1;}
header p{color:var(--ink-soft);font-size:.92rem;margin-top:4px;}

/* NAV */
.part-nav{
  display:flex;flex-wrap:wrap;gap:6px;justify-content:center;
  margin-bottom:28px;position:sticky;top:0;z-index:10;
  background:rgba(250,246,238,.92);backdrop-filter:blur(6px);
  padding:10px 0 12px;border-bottom:1px solid #e2dac2;
}
.pnav-btn{
  font-family:'Inter',sans-serif;font-size:.72rem;font-weight:600;
  padding:6px 12px;border-radius:16px;border:1.5px solid #d9d0b3;
  background:#fff;cursor:pointer;color:var(--ink);transition:.15s;
  white-space:nowrap;
}
.pnav-btn:hover{border-color:var(--pink);}
.pnav-btn.active{background:var(--pink);color:#fff;border-color:var(--pink);}
.pnav-btn .pn-check{margin-left:3px;color:var(--green);font-size:.7rem;}
.pnav-btn.active .pn-check{color:#fff;}

/* PART */
.part{display:none;}
.part.active{display:block;animation:fade .3s ease;}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.part-title{
  font-family:'Kalam',cursive;font-size:1.8rem;color:var(--ink);
  margin-bottom:4px;
}
.part-sub{font-size:.85rem;color:var(--ink-soft);margin-bottom:20px;}

/* READING */
.reading-box{
  background:#fffdf8;border:1px solid #e7dfc8;border-left:5px solid var(--blue);
  border-radius:4px 10px 10px 4px;padding:18px 20px;margin-bottom:22px;
  font-size:.9rem;line-height:1.7;color:var(--ink);
}
.reading-box h3{font-family:'Kalam',cursive;color:var(--blue);margin-bottom:8px;font-size:1.15rem;}

/* QUESTION CARD */
.q-card{
  background:#fffdf8;border:1px solid #e7dfc8;border-left:5px solid var(--pink);
  border-radius:4px 10px 10px 4px;padding:16px 18px;margin-bottom:14px;
  transition:border-color .2s;
}
.q-card.answered-ok{border-left-color:var(--green);}
.q-card.answered-bad{border-left-color:var(--red);}
.q-card.grammar{border-left-color:var(--green);}
.q-card.vocab{border-left-color:var(--blue);}
.q-card.prep{border-left-color:var(--yellow);}
.q-card.read{border-left-color:#9b59b6;}
.q-card.strat{border-left-color:#e67e22;}
.q-card.b1b2{border-left-color:#1abc9c;}

.q-num{font-family:'Kalam',cursive;color:var(--pink);font-size:1rem;margin-right:4px;}
.q-text{font-size:.95rem;line-height:1.5;margin-bottom:10px;}
.q-note{font-size:.78rem;color:var(--ink-soft);font-style:italic;margin-top:4px;display:none;}

.opts{display:flex;flex-direction:column;gap:6px;}
.opt-label{
  display:flex;align-items:center;gap:10px;
  padding:9px 14px;border-radius:10px;border:1.5px solid #e2dac2;
  background:#fff;cursor:pointer;font-size:.9rem;transition:.12s;
  user-select:none;
}
.opt-label:hover{border-color:var(--pink);background:#fff7fb;}
.opt-label input{display:none;}
.opt-dot{
  width:18px;height:18px;border-radius:50%;border:2px solid #ccc;
  flex-shrink:0;display:flex;align-items:center;justify-content:center;
  transition:.15s;font-size:.7rem;color:transparent;
}
.opt-label.selected .opt-dot{border-color:var(--blue);background:var(--blue);color:#fff;}
.opt-label.correct .opt-dot{border-color:var(--green);background:var(--green);color:#fff;}
.opt-label.correct{border-color:var(--green);background:var(--green-bg);}
.opt-label.wrong .opt-dot{border-color:var(--red);background:var(--red);color:#fff;}
.opt-label.wrong{border-color:var(--red);background:var(--red-bg);text-decoration:line-through;}
.opt-label.disabled{pointer-events:none;opacity:.85;}

/* BUTTONS */
.btn-row{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap;}
.btn{
  font-family:'Inter',sans-serif;font-weight:600;font-size:.88rem;
  padding:11px 22px;border-radius:10px;border:none;cursor:pointer;
  transition:.15s;
}
.btn-check{background:var(--ink);color:#fff;}
.btn-check:hover{background:var(--pink);}
.btn-check:disabled{background:#ccc;cursor:default;}
.btn-next{background:#fff;color:var(--ink);border:1.5px solid #d9d0b3;}
.btn-next:hover{border-color:var(--pink);color:var(--pink);}

/* PART RESULT */
.part-result{
  background:#fff;border:2px solid var(--green);border-radius:12px;
  padding:20px 24px;margin-top:18px;text-align:center;display:none;
}
.part-result.show{display:block;animation:fade .35s ease;}
.part-score{font-family:'Caveat',cursive;font-size:2.2rem;color:var(--green);}
.part-msg{font-size:.9rem;color:var(--ink-soft);margin-top:4px;}

/* FINAL RESULT */
.final-result{
  display:none;text-align:center;padding:40px 20px;
}
.final-result.active{display:block;animation:fade .4s ease;}
.final-big{font-family:'Caveat',cursive;font-size:3.2rem;color:var(--pink);line-height:1.1;}
.final-sub{font-size:1.1rem;color:var(--ink);margin-top:8px;}
.final-detail{margin-top:18px;font-size:.88rem;color:var(--ink-soft);}
.final-bar-wrap{
  max-width:400px;margin:16px auto;height:14px;border-radius:10px;
  background:#eee3ca;overflow:hidden;
}
.final-bar-fill{height:100%;border-radius:10px;background:linear-gradient(90deg,var(--pink),var(--blue));transition:width .6s ease;}
.btn-retry{
  margin-top:18px;background:var(--pink);color:#fff;font-size:1rem;
  padding:12px 28px;border:none;border-radius:10px;cursor:pointer;
  font-family:'Inter',sans-serif;font-weight:600;
}
.btn-retry:hover{background:var(--ink);}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>English Test | Practice ✏️</h1>
    <p>Baseado nas tuas anotações — seleciona, confere e vê teu resultado no final!</p>
  </header>
  <nav class="part-nav" id="partNav"></nav>
  <div id="partsWrap"></div>
  <div class="final-result" id="finalResult">
    <div class="final-big" id="finalBig"></div>
    <div class="final-sub" id="finalSub"></div>
    <div class="final-bar-wrap"><div class="final-bar-fill" id="finalBar"></div></div>
    <div class="final-detail" id="finalDetail"></div>
    <button class="btn-retry" onclick="location.reload()">Refazer o teste 🔄</button>
  </div>
</div>

<script>
const PARTS=[
{
  id:"grammar1",title:"Part 1 — Grammar",sub:"Choose the correct answer.",cat:"grammar",
  qs:[
    {q:'She ___ from Brazil.',opts:['am','is','are','be'],a:1},
    {q:'They ___ coffee every morning.',opts:['drinks','drinking','drink','drank'],a:2},
    {q:'My brother ___ a car.',opts:['have','has','having','haves'],a:1},
    {q:'We ___ TV now.',opts:['watch','watches','are watching','watching'],a:2},
    {q:'Yesterday I ___ to the mall.',opts:['go','went','gone','going'],a:1},
  ]
},
{
  id:"vocab",title:"Part 2 — Vocabulary",sub:"Choose the correct word.",cat:"vocab",
  qs:[
    {q:'I use a ___ to call people.',opts:['wallet','phone','key','bottle'],a:1},
    {q:'You sleep in a ___.',opts:['kitchen','garage','bedroom','garden'],a:2},
    {q:'A flight attendant works on an ___.',opts:['train','bus','airplane','ship'],a:2,
     note:'"On" é usado antes de transportes em que é possível andar dentro deles.'},
    {q:'You wear these on your feet.',opts:['gloves','hat','shoes','scarf'],a:2},
    {q:'The opposite of "cheap" is:',opts:['small','expensive','tall','fast'],a:1},
  ]
},
{
  id:"prep",title:"Part 3 — Prepositions",sub:"Choose the correct option.",cat:"prep",
  qs:[
    {q:'My birthday is ___ August.',opts:['at','on','in','from'],a:2,
     note:'mês sozinho → in | mês + data → on'},
    {q:'The meeting is ___ 3 p.m.',opts:['at','in','on','by'],a:0},
    {q:'I usually stay home ___ Sundays.',opts:['in','on','at','from'],a:1},
    {q:'The book is ___ the table.',opts:['on','in','at','between'],a:0},
    {q:'She is sitting ___ her friend.',opts:['under','between','next to','through'],a:2},
  ]
},
{
  id:"reading",title:"Part 4 — Reading Comprehension",sub:"Read the text and answer the questions.",cat:"read",
  reading:`<h3>Working in a Multicultural Environment</h3>
<p>Nowadays, many companies employ people from different countries and cultural backgrounds. This diversity can bring many benefits to the workplace. Employees have the opportunity to learn from each other, share different perspectives, and develop a better understanding of the world.</p>
<p>However, working in a multicultural environment can also present some challenges. People may have different communication styles, expectations, and ways of solving problems. For example, in some cultures, direct communication is appreciated, while in others, people prefer a more indirect approach.</p>
<p>To be successful in an international workplace, employees need to be flexible, respectful, and open-minded. Strong communication skills are also essential. When people make an effort to understand each other's differences, teamwork becomes more effective and the work environment becomes more positive.</p>
<p>As businesses continue to expand globally, the ability to work well with people from different backgrounds is becoming increasingly important. Many employers now consider cultural awareness to be one of the most valuable professional skills.</p>`,
  qs:[
    {q:'What is the main idea of the text?',
     opts:['Companies should hire fewer international employees.',
           'Working with people from different cultures has advantages and challenges.',
           'Communication is not important in international companies.',
           'Cultural differences always create problems.'],a:1},
    {q:'According to the text, one benefit of diversity is:',
     opts:['Employees work fewer hours.','Companies spend less money.',
           'People can learn from different perspectives.','Everyone communicates in the same way.'],a:2},
    {q:'The word "diversity" in the second sentence is closest in meaning to:',
     opts:['Similarity','Variety','Competition','Experience'],a:1},
    {q:'Why can multicultural workplaces be challenging?',
     opts:['Employees speak exactly the same way.',
           'People may have different communication styles and expectations.',
           'International companies are smaller.','Workers do not need teamwork.'],a:1},
    {q:'According to the text, what qualities help employees succeed in an international workplace?',
     opts:['Flexibility, respect, and open-mindedness.','Speed and competitiveness.',
           'Technical knowledge only.','Independence and silence.'],a:0},
    {q:'What does the word "others" refer to in the third paragraph?',
     opts:['Employers','Differences','Other people or colleagues','Businesses'],a:2},
  ]
},
{
  id:"strat",title:"Part 5 — Test Strategy Practice",sub:"Choose the best answer.",cat:"strat",
  qs:[
    {q:'I ___ my homework every day.',opts:['do','does','did','doing'],a:0},
    {q:'There ___ two people in the room.',opts:['is','are','am','be'],a:1},
    {q:"She doesn't ___ coffee.",opts:['drinks','drank','drink','drinking'],a:2},
    {q:'We are going ___ Dubai next month.',opts:['in','to','at','on'],a:1},
    {q:'Which sentence is correct?',
     opts:['He go to work every day.','He goes to work every day.',
           'He going to work every day.','He gone to work every day.'],a:1},
  ]
},
{
  id:"b1b2",title:"Part 6 — Grammar B1/B2",sub:"Nível mais avançado. Choose the best answer.",cat:"b1b2",
  qs:[
    {q:'If I ___ enough money, I would travel more often.',opts:['have','had','will have','having'],a:1},
    {q:'She ___ for the company since 2020.',opts:['works','worked','has worked','is working'],a:2},
    {q:'The flight was delayed ___ bad weather.',opts:['because','because of','despite','although'],a:1},
    {q:'By the time we arrived at the airport, the passengers ___.',
     opts:['boarded','have boarded','had boarded','are boarding'],a:2},
    {q:'Which sentence is correct?',
     opts:['I look forward to meet you.','I look forward meeting you.',
           'I look forward to meeting you.','I look forward meet you.'],a:2},
    {q:'You ___ wear a seatbelt during takeoff and landing.',opts:['should','might','must','could'],a:2,
     note:'must = obrigação'},
    {q:'If I ___ the customer, I would apologize immediately.',opts:['am','was','were','be'],a:2,
     note:'If I were = hipoteticamente falando…'},
    {q:'The manager asked me ___ the report before noon.',opts:['finish','to finish','finishing','finished'],a:1},
    {q:'This is the hotel ___ we stayed last year.',opts:['who','which','where','what'],a:2},
    {q:"I don't have ___ information about the flight yet.",opts:['many','much','a few','several'],a:1,
     note:'much + uncountable nouns (information)'},
  ]
}
];

// STATE
const partState={};
PARTS.forEach(p=>{partState[p.id]={answers:{},checked:false,correct:0};});

// RENDER NAV
const nav=document.getElementById('partNav');
PARTS.forEach((p,i)=>{
  const b=document.createElement('button');
  b.className='pnav-btn'+(i===0?' active':'');
  b.id='nav-'+p.id;
  b.textContent=p.title.replace(/Part \d+ — /,'P'+(i+1)+': ');
  b.onclick=()=>showPart(p.id);
  nav.appendChild(b);
});

// RENDER PARTS
const pw=document.getElementById('partsWrap');
PARTS.forEach((p,pi)=>{
  const d=document.createElement('div');
  d.className='part'+(pi===0?' active':'');
  d.id='part-'+p.id;

  let h=`<div class="part-title">${p.title}</div><div class="part-sub">${p.sub}</div>`;
  if(p.reading) h+=`<div class="reading-box">${p.reading}</div>`;

  p.qs.forEach((q,qi)=>{
    const uid=p.id+'-'+qi;
    h+=`<div class="q-card ${p.cat}" id="qc-${uid}">
      <div class="q-text"><span class="q-num">${qi+1}.</span> ${q.q}</div>
      <div class="opts" id="opts-${uid}">`;
    q.opts.forEach((o,oi)=>{
      h+=`<label class="opt-label" id="ol-${uid}-${oi}" onclick="pickOpt('${uid}',${oi})">
        <span class="opt-dot">✓</span>
        <span>${String.fromCharCode(97+oi)}) ${o}</span>
      </label>`;
    });
    h+=`</div>`;
    if(q.note) h+=`<div class="q-note" id="note-${uid}">${q.note}</div>`;
    h+=`</div>`;
  });

  h+=`<div class="btn-row">
    <button class="btn btn-check" id="btnCheck-${p.id}" onclick="checkPart('${p.id}')">Corrigir esta parte ✅</button>
    ${pi<PARTS.length-1?`<button class="btn btn-next" onclick="showPart('${PARTS[pi+1].id}')">Próxima parte →</button>`:''}
  </div>`;
  h+=`<div class="part-result" id="res-${p.id}">
    <div class="part-score" id="score-${p.id}"></div>
    <div class="part-msg" id="msg-${p.id}"></div>
  </div>`;

  d.innerHTML=h;
  pw.appendChild(d);
});

function showPart(id){
  document.querySelectorAll('.part').forEach(p=>p.classList.remove('active'));
  document.getElementById('part-'+id).classList.add('active');
  document.querySelectorAll('.pnav-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('nav-'+id).classList.add('active');
  document.getElementById('finalResult').classList.remove('active');
  window.scrollTo({top:0,behavior:'smooth'});
}

function pickOpt(uid,oi){
  const pid=uid.split('-')[0];
  // allow re-pick only from b1b2 multi-digit id hack — actually just split properly
  const parts=uid.split('-');
  const partId=parts.slice(0,-1).join('-'); // handles "b1b2-0"
  if(partState[partId]?.checked) return;

  const pdata=PARTS.find(p=>p.id===partId);
  const qi=parseInt(parts[parts.length-1]);
  const total=pdata.qs.length;

  // clear prev
  for(let i=0;i<pdata.qs[qi].opts.length;i++){
    document.getElementById('ol-'+uid+'-'+i).classList.remove('selected');
  }
  document.getElementById('ol-'+uid+'-'+oi).classList.add('selected');
  partState[partId].answers[qi]=oi;
}

function checkPart(pid){
  const pdata=PARTS.find(p=>p.id===pid);
  const st=partState[pid];
  if(st.checked) return;

  // check all answered
  const unanswered=pdata.qs.length-Object.keys(st.answers).length;
  if(unanswered>0){
    alert(`Faltam ${unanswered} questão(ões)! Responde todas antes de corrigir.`);
    return;
  }

  st.checked=true;
  let correct=0;

  pdata.qs.forEach((q,qi)=>{
    const uid=pid+'-'+qi;
    const chosen=st.answers[qi];
    const isOk=chosen===q.a;
    if(isOk) correct++;

    q.opts.forEach((o,oi)=>{
      const lbl=document.getElementById('ol-'+uid+'-'+oi);
      lbl.classList.add('disabled');
      if(oi===q.a) lbl.classList.add('correct');
      if(oi===chosen&&!isOk) lbl.classList.add('wrong');
    });

    const card=document.getElementById('qc-'+uid);
    card.classList.add(isOk?'answered-ok':'answered-bad');

    if(q.note){
      document.getElementById('note-'+uid).style.display='block';
    }
  });

  st.correct=correct;
  const pct=Math.round((correct/pdata.qs.length)*100);

  const scoreEl=document.getElementById('score-'+pid);
  scoreEl.textContent=`${correct} / ${pdata.qs.length}  (${pct}%)`;

  const msgEl=document.getElementById('msg-'+pid);
  if(pct===100) msgEl.textContent='Perfeito!! 🎉💗';
  else if(pct>=80) msgEl.textContent='Arrasou! Quase tudo certo! 🔥';
  else if(pct>=60) msgEl.textContent='Bom! Revisa os erros e tenta de novo 💪';
  else msgEl.textContent='Dá uma revisada no caderno e tenta de novo! 📖';

  document.getElementById('res-'+pid).classList.add('show');
  document.getElementById('btnCheck-'+pid).disabled=true;

  // nav check
  const navBtn=document.getElementById('nav-'+pid);
  if(!navBtn.querySelector('.pn-check')){
    const sp=document.createElement('span');
    sp.className='pn-check';
    sp.textContent=pct===100?'✓':'·';
    navBtn.appendChild(sp);
  }

  // check if all parts done
  const allDone=PARTS.every(p=>partState[p.id].checked);
  if(allDone) showFinal();
}

function showFinal(){
  let totalQ=0,totalC=0;
  let detail=[];
  PARTS.forEach(p=>{
    const n=p.qs.length;
    const c=partState[p.id].correct;
    totalQ+=n; totalC+=c;
    detail.push(`${p.title}: ${c}/${n}`);
  });
  const pct=Math.round((totalC/totalQ)*100);

  document.getElementById('finalBig').textContent=
    pct===100?'100% — PERFEITO!! 🎉':
    pct>=80?`${pct}% — Muito bem! 🔥`:
    pct>=60?`${pct}% — Bom trabalho! 💪`:
    `${pct}% — Continue estudando! 📖`;
  document.getElementById('finalSub').textContent=`Você acertou ${totalC} de ${totalQ} questões.`;
  document.getElementById('finalBar').style.width=pct+'%';
  document.getElementById('finalDetail').innerHTML=detail.join(' &nbsp;|&nbsp; ');
  document.getElementById('finalResult').classList.add('active');
}
</script>
</body>
</html>
